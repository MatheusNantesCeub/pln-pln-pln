# Execução 100% local, sem créditos de API: LLM e embeddings rodam no Ollama.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Requer GPU NVIDIA com Docker Desktop (WSL2). Sem GPU, remova o bloco "deploy"
# do serviço ollama (funciona em CPU, porém bem mais devagar).

services:
  rag-demo-app:
    environment:
      # O SDK da OpenAI usa OPENAI_BASE_URL: as chamadas ChatOpenAI vão para o Ollama
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_MODEL=${LOCAL_LLM_MODEL:-qwen2.5:7b}
      - MODEL_QA_GENERATOR=${LOCAL_LLM_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-bge-m3}
      - LOCAL_EMBEDDING_DIMENSION=${LOCAL_EMBEDDING_DIMENSION:-1024}
      - DEFAULT_EMBEDDING_MODEL=local
      - USE_N8N=false
      - ENHANCE_WITH_LLM=false
    volumes:
      # PDFs do arXiv já baixados no projeto ia_arxiv_qdrant
      - ../ia_arxiv_qdrant/pdfs:/data/pdfs:ro
      - ../ia_arxiv_qdrant/manifest.json:/data/manifest.json:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - ollama

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag-network

  # Volumes nomeados: bancos de dados fora da pasta sincronizada pelo OneDrive
  qdrant:
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    # minio/minio saiu do Docker Hub; pgsty/minio é um fork mantido com a mesma CLI
    image: pgsty/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data

  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  ollama_models:
  qdrant_data:
  minio_data:
  postgres_data:
  n8n_data:
